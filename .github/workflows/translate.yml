name: Translate docs

on:
  # Manual trigger for testing and controlled runs.
  workflow_dispatch:

  # TODO: Automatic translation on push to main to be enabled in the future.
  # When enabled, the diff step below decides whether any translatable source
  # files actually changed before doing any work.
  # push:
  #   branches: [main]

env:
  GT_CLI_VERSION: 2.17.0

jobs:
  translate:
    name: Translate changed docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We only need the pushed commit; the diff step fetches the base
          # commit it compares against.
          fetch-depth: 1

      # Compute which source files changed vs. the previous commit and filter
      # them against the translation patterns from main/gt.config.json. Uses a
      # plain git diff with pathspecs to avoid a third-party action.
      - name: Detect changed source files
        id: changed-source
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # On workflow_dispatch there is no push event, so github.event.before
          # is empty; fall back to the pushed commit's parent.
          if [ -z "$BEFORE" ]; then
            BEFORE="$(git rev-parse "$AFTER"^)"
          fi

          # git diff compares the two endpoint trees directly and needs both
          # commits present locally. The checkout has AFTER; fetch BEFORE.
          git fetch --depth=1 origin "$BEFORE"

          # ':(glob)' pathspecs mirror the include/exclude globs in
          # main/gt.config.json ('**' spans directories, '*' does not match '/').
          changed="$(git diff --name-only "$BEFORE" "$AFTER" -- \
            ':(glob)main/docs/**/*.mdx' \
            ':(glob)main/docs/oas/**/*.json' \
            ':(glob)main/snippets/**/*.jsx' \
            ':(glob,exclude)main/docs/fr-ca/**' \
            ':(glob,exclude)main/docs/ja-jp/**' \
            ':(glob,exclude)main/snippets/fr-ca/**' \
            ':(glob,exclude)main/snippets/ja-jp/**')"

          if [ -n "$changed" ]; then
            echo "Changed source files:"
            echo "$changed"
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No translatable source files changed."
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Everything below runs only when a translatable source file changed.

      - name: Set up Node.js
        if: steps.changed-source.outputs.any_changed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Install General Translation CLI
        if: steps.changed-source.outputs.any_changed == 'true'
        run: npm install -g "gt@${GT_CLI_VERSION}"

      - name: Run General Translation CLI
        if: steps.changed-source.outputs.any_changed == 'true'
        # File scoping is handled entirely by main/gt.config.json — do not pass
        # individual file paths. Config paths are relative to main/.
        working-directory: main
        env:
          GT_API_KEY: ${{ secrets.GT_API_KEY }}
          GT_PROJECT_ID: ${{ secrets.GT_PROJECT_ID }}
        run: gt translate

      - name: Create or update translation PR
        if: steps.changed-source.outputs.any_changed == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          sign-commits: true
          title: "chore: update translations"
          commit-message: "chore: update translations"
          # Fixed branch — reused/updated on each run so there is at most one
          # open translation PR at any time.
          branch: translations/update
          base: main
          labels: automated-translation
          body: |
            Automated translations generated by the [General Translation CLI](https://generaltranslation.com/en-US/docs/cli/translate).

            This PR is updated automatically on each push to `main` that changes translatable source files. All translations are regenerated from scratch on every run.
