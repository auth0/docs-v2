name: Dashboard Link Check

# Fails a PR that introduces a legacy (hash-route) or malformed manage.auth0.com link.
# Mirrors link-check.yml's trigger; see scripts/check-dashboard-links.js and
# scripts/data/dashboard-link-policy.json for the rules.

on:
  pull_request:
    branches: [main]
    paths: ['**/*.mdx?']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  dashboard-link-check:
    name: Dashboard Link Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Check out repo
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get changed content files
        id: changed-mdx-files
        uses: tj-actions/changed-files@e0021407031f5be11a464abee9a0776171c79891 # v47.0.1
        with:
          files: |
            **.mdx

      - name: Check dashboard links
        if: steps.changed-mdx-files.outputs.any_changed == 'true'
        run: node scripts/check-dashboard-links.js --ci ${{ steps.changed-mdx-files.outputs.all_changed_files }}
