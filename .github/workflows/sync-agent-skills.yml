name: Sync agent skills

on:
  schedule:
    - cron: '0 13 * * 1-5' # Mon-Fri at 1pm UTC (9am ET)
  workflow_dispatch:

jobs:
  sync-agent-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out docs-v2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out agent-skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: auth0/agent-skills
          path: agent-skills

      - name: Copy skills
        run: |
          rm -rf main/.mintlify/skills/*
          cp -r agent-skills/plugins/auth0/skills/auth0* main/.mintlify/skills
          rm -rf agent-skills

      - name: Open or update PR
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          sign-commits: true
          title: "chore: sync Mintlify agent skills"
          commit-message: "chore: sync Mintlify agent skills"
          branch: automated/mintlify-agent-skills-update
          body: |
            Automated sync of SKILL.md files from [auth0/agent-skills](https://github.com/auth0/agent-skills).
            These files are served via Mintlify's skills discovery endpoint at \`auth0.com/docs/.well-known/skills/\`.
