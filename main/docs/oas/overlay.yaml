overlay: 1.1.0
info:
  title: API docs adjustments
  version: 1.0.0
actions:
  - target: $.paths.*[?(@.x-release-lifecycle == 'GA')]
    update:
      x-mint:
        content: >
          ### Release Lifecycle

          <Badge color="blue">Generally Available</Badge>
  - target: $.paths.*[?(@.x-release-lifecycle == 'EA')]
    update:
      x-mint:
        content: >
          ### Release Lifecycle

          <Badge color="blue">Early Access</Badge>
  - target: $.paths.*[?(@.x-release-lifecycle == 'beta')]
    update:
      x-mint:
        content: >
          ### Release Lifecycle

          <Badge color="blue">Beta</Badge>
  - target: $.paths.*[?(@.x-release-lifecycle == 'planned')]
    remove: true
  - target: $.paths.*[?(@.x-release-lifecycle == 'deprecated')]
    update:
      x-mint:
        metadata:
          deprecated: true
        content: >
          ### Release Lifecycle

          <Badge color="red">Deprecated</Badge>
