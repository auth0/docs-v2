# Auth0 Deploy CLI tenant definition for the docs screenshot tenant.
# Import:  AUTH0_CLIENT_SECRET=... a0deploy import -c scripts/screenshots/tenant/config.json -i scripts/screenshots/tenant/tenant.yaml
# Names reuse the sample companies already used in docs screenshots (Acme, Travel0, Big Holdings, Co.).
# Users are not managed by Deploy CLI; create a few by hand after import (see README.md).

tenant:
  friendly_name: Travel0
  support_email: ##SUPPORT_EMAIL##
  support_url: https://travel0.example.com/support
  enabled_locales:
    - en
    - ja
    - fr-CA
  flags:
    enable_client_connections: false

clients:
  - name: Acme Bot
    app_type: spa
    description: Sample single-page application used in Dashboard screenshots
    callbacks:
      - http://localhost:3000/callback
    allowed_logout_urls:
      - http://localhost:3000
    web_origins:
      - http://localhost:3000
    grant_types:
      - authorization_code
      - refresh_token
    oidc_conformant: true
    token_endpoint_auth_method: none
  - name: Travel0 Web
    app_type: regular_web
    description: Sample regular web application
    callbacks:
      - https://travel0.example.com/callback
    allowed_logout_urls:
      - https://travel0.example.com
    grant_types:
      - authorization_code
      - refresh_token
    oidc_conformant: true
  - name: Travel0 Backend
    app_type: non_interactive
    description: Sample machine-to-machine application
    grant_types:
      - client_credentials
    oidc_conformant: true
  - name: Acme Mobile
    app_type: native
    description: Sample native application
    callbacks:
      - com.acme.mobile://callback
    grant_types:
      - authorization_code
      - refresh_token
    oidc_conformant: true

resourceServers:
  - name: Travel0 API
    identifier: https://api.travel0.example.com
    signing_alg: RS256
    token_lifetime: 86400
    enforce_policies: true
    token_dialect: access_token_authz
    scopes:
      - value: read:bookings
        description: Read bookings
      - value: write:bookings
        description: Create and update bookings
      - value: read:reports
        description: Read reports

clientGrants:
  - client_id: Travel0 Backend
    audience: https://api.travel0.example.com
    scope:
      - read:bookings
      - write:bookings

# Database connections (strategy: auth0) use a separate top-level key: Deploy CLI's connections
# handler explicitly excludes strategy "auth0" ("we have a separate handler for it"), so putting
# Username-Password-Authentication under connections: causes it to look nonexistent and get
# recreated, which 409s because it already exists on every tenant by default.
databases:
  - name: Username-Password-Authentication
    strategy: auth0
    is_domain_connection: false
    options:
      passwordPolicy: good
      brute_force_protection: true
      disable_signup: false
    enabled_clients:
      - Acme Bot
      - Travel0 Web
      - Acme Mobile

connections:
  - name: email
    strategy: email
    options:
      name: email
      syntax: liquid
      from: '{{ application.name }} <no-reply@travel0.example.com>'
      subject: 'Your verification code for {{ application.name }}'
      # Deploy CLI loads the HTML body from a file next to this YAML, not inline: the YAML
      # key is options.email.body (a path), which Deploy CLI maps to the real Management
      # API field (options.template) on import.
      email:
        body: ./email.html
      totp:
        time_step: 300
        length: 6
    enabled_clients:
      - Acme Bot
  - name: big-holdings-oidc
    strategy: oidc
    display_name: Big Holdings OIDC
    options:
      type: back_channel
      issuer: https://accounts.google.com
      discovery_url: https://accounts.google.com/.well-known/openid-configuration
      client_id: docs-screenshots-placeholder
      client_secret: docs-screenshots-placeholder
      scope: openid profile email
    enabled_clients:
      - Travel0 Web
  # SAML and Okta Workforce connections removed for the initial import: SAML needs a real signing
  # cert, Okta needs a real dev org domain. Re-add from git history once those exist (see
  # IMPLEMENTATION.md Step 7.3 for the openssl command and the Okta note).

roles:
  - name: Travel Agent
    description: Can read and write bookings
    permissions:
      - permission_name: read:bookings
        resource_server_identifier: https://api.travel0.example.com
      - permission_name: write:bookings
        resource_server_identifier: https://api.travel0.example.com
  - name: Analyst
    description: Can read reports
    permissions:
      - permission_name: read:reports
        resource_server_identifier: https://api.travel0.example.com

organizations:
  # client_grants (M2M access to an organization) requires a paid plan feature
  # ("feature_not_enabled": Machine to Machine access to Organizations) that this dev tenant does
  # not have. Removed here; re-add once the real tenant's plan supports it. This means the
  # manage-m2m-access screenshot rows cannot be captured on this tenant as-is.
  - name: big-holdings
    display_name: Big Holdings, Co.
    branding:
      colors:
        primary: '#0059d6'
        page_background: '#ffffff'
    connections:
      - name: Username-Password-Authentication
        assign_membership_on_login: true
  - name: acme-corp
    display_name: Acme Corporation
    connections:
      - name: Username-Password-Authentication
        assign_membership_on_login: false
  - name: northwind
    display_name: Northwind Traders
    connections:
      - name: email
        assign_membership_on_login: true

actions:
  - name: Log login event
    code: ./actions/log-login.js
    runtime: node22
    status: built
    deployed: true
    supported_triggers:
      - id: post-login
        version: v3

triggers:
  post-login:
    - action_name: Log login event
      display_name: Log login event

branding:
  colors:
    primary: '#0059d6'
    page_background: '#f4f6f8'
  logo_url: https://cdn.auth0.com/website/bob/press/logo-light.png

emailTemplates:
  - template: verify_email
    enabled: true
    from: 'Travel0 <no-reply@travel0.example.com>'
    subject: 'Verify your Travel0 account'
    syntax: liquid
    body: emailTemplates/verify_email.html
